version: 0.1
# clang-format 14.0.1 and 17.0.1 come from the trunk.io CDN (clang-format-only tarballs;
# 14.0.1 has no linux-aarch64 build, neither has a Windows build).
# Every other version comes from https://github.com/cpp-linter/clang-tools-static-binaries:
# one static, single-file executable per platform (linux, macos, windows on x86_64 and arm64),
# with SHA512SUMS and GitHub build attestations. Versions there (LLVM 12 and later):
# https://cpp-linter.github.io/clang-tools-static-binaries/
downloads:
  - name: clang-format
    version: 20.1.0
    args:
      major: ${version}=>(?P<major>\d+)\..*
    downloads:
      # trunk.io CDN. One entry per version, since a version range cannot list single versions.
      - os:
          linux: linux
        cpu:
          arm_64: aarch64
          x86_64: x86_64
        url: https://trunk.io/releases/clang-format-${version}-${os}-${cpu}.tar.gz
        version: 14.0.1
      - os:
          macos: macos
        cpu:
          x86_64: x86_64
          arm_64: arm64
        url: https://trunk.io/releases/clang-format-${version}-${os}-${cpu}.tar.gz
        version: 14.0.1
      - os:
          linux: linux
        cpu:
          arm_64: aarch64
          x86_64: x86_64
        url: https://trunk.io/releases/clang-format-${version}-${os}-${cpu}.tar.gz
        version: 17.0.1
      - os:
          macos: macos
        cpu:
          x86_64: x86_64
          arm_64: arm64
        url: https://trunk.io/releases/clang-format-${version}-${os}-${cpu}.tar.gz
        version: 17.0.1
      # Everything else: cpp-linter/clang-tools-static-binaries.
      - os:
          linux: linux
          macos: macos
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/cpp-linter/clang-tools-static-binaries/releases/download/llvm-${version}/clang-format-${major}_${os}-${cpu}
      - os:
          windows: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/cpp-linter/clang-tools-static-binaries/releases/download/llvm-${version}/clang-format-${major}_${os}-${cpu}.exe
tools:
  definitions:
    - name: clang-format
      download: clang-format
      shims: [clang-format]
      known_good_version: 14.0.1
      environment:
        - name: PATH
          list: ["${tool}", "${tool}/bin"]
lint:
  definitions:
    - name: clang-format
      supported_platforms: [linux, macos, windows]
      description: Formatter for C/C++ and Protobuf
      files: [c/c++, cuda, proto]
      commands:
        - name: format
          output: rewrite
          run: clang-format -i ${target}
          success_codes: [0, 1]
          batch: true
          in_place: true
          cache_results: true
          formatter: true
      tools: [clang-format]
      suggest_if: config_present
      direct_configs: [.clang-format]
      known_good_version: 20.1.0
      version_command:
        parse_regex: ${semver}
        run: clang-format --version
