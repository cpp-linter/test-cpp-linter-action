# Temporary: produces the screenshots of cpp-linter v2's redesigned comment, review
# and annotations for the cpp-linter-rs README. Remove after the screenshots are taken.
name: v2 preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  cpp-linter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build cpp-linter v2 from the redesign branch
        # The status marks are not on the main branch of cpp-linter/.github yet,
        # so this build loads them from the branch that adds them.
        run: |
          git clone --depth 1 -b claude/project-thread-plvb9l \
            https://github.com/cpp-linter/cpp-linter-rs "$RUNNER_TEMP/rs"
          sed -i 's#cpp-linter/.github/main/branding#cpp-linter/.github/claude/project-thread-plvb9l/branding#' \
            "$RUNNER_TEMP/rs/cpp-linter/src/markdown.rs"
          cargo build --release --features bin --bin cpp-linter \
            --manifest-path "$RUNNER_TEMP/rs/Cargo.toml"
          cp "$RUNNER_TEMP/rs/target/release/cpp-linter" "$RUNNER_TEMP/cpp-linter"

      - name: Generate compilation database
        run: cmake -Bbuild src

      - name: Run cpp-linter
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          "$RUNNER_TEMP/cpp-linter"
          --style=file
          --tidy-checks=""
          --version=21
          --ignore=build
          --database=build
          --extra-arg="-std=c++14 -Wall"
          --thread-comments=update
          --pr-review=true
          --file-annotations=true
          --step-summary=true
