# Temporary: produces the step summary screenshot of cpp-linter v2.0.0-rc.27 for the
# cpp-linter-rs README and docs. Remove after the screenshot is taken.
name: v2 preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  cpp-linter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download cpp-linter v2.0.0-rc.27
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cpp-linter/v2.0.0-rc.27 -R cpp-linter/cpp-linter-rs \
            -p 'cpp-linter-x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/cpp-linter-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 3 -name cpp-linter -type f
          bin=$(find "$RUNNER_TEMP" -maxdepth 3 -name cpp-linter -type f | head -1)
          [ "$bin" = "$RUNNER_TEMP/cpp-linter" ] || cp "$bin" "$RUNNER_TEMP/cpp-linter"
          "$RUNNER_TEMP/cpp-linter" --version

      - name: Generate compilation database
        run: cmake -Bbuild src

      - name: Run cpp-linter
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          "$RUNNER_TEMP/cpp-linter"
          --style=file
          --tidy-checks=""
          --version=21
          --ignore=build
          --database=build
          --extra-arg="-std=c++14 -Wall"
          --thread-comments=false
          --pr-review=false
          --file-annotations=false
          --step-summary=true
