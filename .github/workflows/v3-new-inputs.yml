name: v3 new inputs

# Temporary e2e test of cpp-linter-action#543 (v3 defaults, sarif-file, strict).

on:
  push:
    branches: [claude/project-thread-r495nc]

permissions: {}

env:
  ACTION: cpp-linter/cpp-linter-action@claude/project-thread-r495nc

jobs:
  defaults:
    # Only GITHUB_TOKEN is set: every input uses its v3 default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # would allow a commit comment; the v3 default must not post one on push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: v3 defaults
        id: linter
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report
        if: always()
        shell: bash
        env:
          R: ${{ toJSON(steps.linter) }}
        run: |
          echo "RESULT ${{ matrix.os }} defaults $(jq -c '{outcome, out: .outputs}' <<< "$R")"
          echo "summary bytes: $(wc -c < "$GITHUB_STEP_SUMMARY")"

  strict:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: findings, strict unset
        id: unset
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        with:
          files-changed-only: false
          lines-changed-only: false
          ignore: .github
      - name: findings, strict true
        id: on
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        with:
          files-changed-only: false
          lines-changed-only: false
          ignore: .github
          strict: true
      - name: no files, strict true
        id: empty
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        with:
          files-changed-only: false
          ignore: .github|src
          strict: true
      - name: Report
        if: always()
        shell: bash
        env:
          UNSET: ${{ toJSON(steps.unset) }}
          ON: ${{ toJSON(steps.on) }}
          EMPTY: ${{ toJSON(steps.empty) }}
        run: |
          for s in UNSET ON EMPTY; do
            echo "RESULT ${{ matrix.os }} strict-$s $(jq -c '{outcome, out: .outputs}' <<< "${!s}")"
          done

  sarif:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: v3 with sarif-file
        id: linter
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        with:
          files-changed-only: false
          lines-changed-only: false
          ignore: .github
          sarif-file: out/cpp-linter.sarif
      - name: no files, sarif-file
        uses: cpp-linter/cpp-linter-action@claude/project-thread-r495nc
        with:
          files-changed-only: false
          ignore: .github|src
          sarif-file: empty.sarif
      - name: Report
        if: always()
        shell: bash
        env:
          R: ${{ toJSON(steps.linter.outputs) }}
        run: |
          echo "RESULT ${{ matrix.os }} sarif-outputs $(jq -c . <<< "$R")"
          for f in out/cpp-linter.sarif empty.sarif; do
            echo "RESULT ${{ matrix.os }} $f $(jq -c '{version, tool: .runs[0].tool.driver.name, toolVersion: .runs[0].tool.driver.version, results: (.runs[0].results | length), uris: ([.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique)}' "$f")"
          done
      - name: Upload to code scanning
        if: matrix.os == 'ubuntu-latest'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: out/cpp-linter.sarif
          category: cpp-linter-v3-test
