name: cpp-linter as pkg

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'which branch to test'
        default: 'main'
        required: true

jobs:
  pre-seed-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.extract-version-range.outputs.versions }}
    steps:
      # The LLVM versions that clang-tools-static-binaries currently builds,
      # from its index rather than from its "latest" GitHub release.
      - name: Extract version range
        id: extract-version-range
        shell: python
        run: |-
          import json
          from os import environ
          from urllib.request import urlopen
          url = "https://cpp-linter.github.io/clang-tools-static-binaries/index.json"
          with urlopen(url, timeout=60) as response:
              index = json.load(response)
          versions = sorted(index["versions"], key=int)
          with open(environ["GITHUB_OUTPUT"], mode="a") as gh_out:
              gh_out.write(f"versions={json.dumps(versions)}\n")

  cpp-linter:
    runs-on: windows-latest
    needs: pre-seed-versions

    strategy:
      matrix:
        clang-version: ${{ fromJSON(needs.pre-seed-versions.outputs.versions) }}
        repo: ['cpp-linter/cpp-linter']
        branch: ['${{ inputs.branch }}']
      fail-fast: false

    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install workflow deps
        run: python -m pip install clang-tools git+https://github.com/${{ matrix.repo }}/@${{ matrix.branch }}

      - name: Install clang-tools
        run: >-
          clang-tools install
          clang-format clang-tidy
          --version ${{ matrix.clang-version }}
          --directory ${{ runner.temp }}/llvm

      - name: Setup VS dev env
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache the build artifacts
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ hashFiles('src/CMakeLists.txt', 'src/demo.cpp', 'src/demo.hpp') }}

      - name: Generate  compiler database
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: mkdir build && cmake -Bbuild src -G "NMake Makefiles"

      - name: Run linter as package
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          cpp-linter
          -s=file
          -v=debug
          -i=build
          -p=build
          -V=${{ runner.temp }}/llvm
          -f=false
          --extra-arg="-std=c++14 -Wall"
          --thread-comments=${{ matrix.clang-version == '17' && 'update' }}
          -a=${{ matrix.clang-version == '17' }}

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: |
          echo "some linter checks failed"
          echo "total: ${{ steps.linter.outputs.checks-failed }}"
          echo "clang-format: ${{ steps.linter.outputs.clang-format-checks-failed }}"
          echo "clang-tidy: ${{ steps.linter.outputs.clang-tidy-checks-failed }}"
        # for actual deployment
        # run: exit 1
