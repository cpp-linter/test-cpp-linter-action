name: auto-fix HEAD check (temporary test)

# Temporary: checks that auto-fix still commits when the checked out commit is
# the one that triggered the workflow. Delete together with this branch.

on:
  push:
    branches: [claude/project-thread-y4qppu]

permissions:
  contents: write

jobs:
  same-commit-fixed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cpp-linter/cpp-linter-action@claude/project-thread-y4qppu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: '18'
          style: file
          tidy-checks: '-*'
          files-changed-only: false
          thread-comments: false
          auto-fix: true
      - name: The branch must be one auto-fix commit ahead
        run: |
          git fetch --depth=2 origin "refs/heads/$GITHUB_REF_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          git log --format='%H %an: %s' -2 FETCH_HEAD
          test "$(git rev-parse FETCH_HEAD~1)" = "$GITHUB_SHA"
