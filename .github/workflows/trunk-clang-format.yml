name: Trunk clang-format plugin with cpp-linter binaries

on:
  push:
    branches: [claude/project-thread-3y9j3l]
    paths: [trunk-test/**, .github/workflows/trunk-clang-format.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trunk:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Old versions still served from trunk.io
          - { plugin: final, os: ubuntu-latest, version: 14.0.1 }
          - { plugin: final, os: macos-latest, version: 14.0.1 }
          - { plugin: final, os: ubuntu-latest, version: 17.0.1 }
          - { plugin: final, os: ubuntu-24.04-arm, version: 17.0.1 }
          - { plugin: final, os: macos-latest, version: 17.0.1 }
          # Versions that used to come from trunk.io, now from cpp-linter
          - { plugin: final, os: ubuntu-latest, version: 16.0.3 }
          - { plugin: final, os: ubuntu-latest, version: 20.1.0 }
          - { plugin: final, os: macos-latest, version: 20.1.0 }
          # New versions and platforms
          - { plugin: final, os: ubuntu-latest, version: 21.1.8 }
          - { plugin: final, os: ubuntu-24.04-arm, version: 23.1.4 }
          - { plugin: final, os: macos-latest, version: 23.1.4 }
          - { plugin: final, os: windows-latest, version: 21.1.8 }
          - { plugin: final, os: windows-latest, version: 23.1.4 }
          - { plugin: final, os: windows-11-arm, version: 23.1.4 }
          # No version pinned: what does `trunk check enable clang-format` pick?
          - { plugin: final, os: ubuntu-latest, version: latest }
          - { plugin: upstream, os: ubuntu-latest, version: latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up a local copy of trunk-io/plugins with the modified plugin
        env:
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ matrix.version }}
        run: |
          git clone --depth 1 https://github.com/trunk-io/plugins "$RUNNER_TEMP/trunk-plugins"
          if [ "$PLUGIN" = final ]; then
            cp trunk-test/plugin.yaml "$RUNNER_TEMP/trunk-plugins/linters/clang-format/plugin.yaml"
          fi
          if [ "$VERSION" = latest ]; then enabled="[]"; else enabled="[clang-format@$VERSION]"; fi
          plugins_dir="$(cd "$RUNNER_TEMP/trunk-plugins" && (pwd -W 2>/dev/null || pwd))"
          mkdir -p .trunk
          cat > .trunk/trunk.yaml <<EOT
          version: 0.1
          cli:
            version: 1.25.0
          plugins:
            sources:
              - id: trunk
                local: $plugins_dir
          lint:
            enabled: $enabled
            ignore:
              - linters: [ALL]
                paths: [trunk-test/**, cpp-linter-action/**, .github/**]
          EOT
          cat .trunk/trunk.yaml
      - name: trunk check enable clang-format (no version pinned)
        if: matrix.version == 'latest'
        run: |
          npx -y @trunkio/launcher check enable clang-format --ci 2>&1 | tail -20 || true
          cat .trunk/trunk.yaml
          picked="$(grep -oE 'clang-format@[^ "]+' .trunk/trunk.yaml | cut -d@ -f2)"
          echo "${{ matrix.plugin }}: trunk check enable picked clang-format@$picked" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$picked" >> "$GITHUB_ENV"
      - name: trunk check (expects formatting issues in src/)
        run: |
          set +e
          npx -y @trunkio/launcher check --all --filter=clang-format --no-fix --print-failures --ci 2>&1 | tee trunk-out.txt
          echo "trunk exit code: ${PIPESTATUS[0]}"
          set -e
          grep -E "src.demo\.(cpp|hpp)" trunk-out.txt
      - name: Which clang-format did Trunk install?
        run: |
          VERSION="${VERSION:-${{ matrix.version }}}"
          for d in "$HOME/.cache/trunk" "${LOCALAPPDATA:-/nonexistent}/trunk"; do
            if [ -d "$d" ]; then find "$d" -ipath "*clang-format*" \( -iname 'clang-format' -o -iname 'clang-format.exe' \) -type f 2>/dev/null; fi
          done | tee found.txt
          bin="$(grep -F "$VERSION" found.txt | head -1)"
          [ -n "$bin" ] || bin="$(head -1 found.txt)"
          ls -la "$bin"
          "$bin" --version | tee version.txt
          grep -F "$VERSION" version.txt
          echo "${{ matrix.plugin }} ${{ matrix.os }} $VERSION: $(cat version.txt)" >> "$GITHUB_STEP_SUMMARY"
