name: v3 clean e2e

# Temporary test: cpp-linter-action v3.0.0-rc0 (tip eb04e64, pins cpp-linter 2.0.0rc25 =
# cpp-linter-rs v2.0.0-rc.26) used the way users use it: `uses: owner/repo@<sha>`,
# fresh runners, no local checkout of the action. Each case prints one `RESULT ...` line.

on:
  push:
    branches: [claude/project-thread-u751ea]

permissions: {}

jobs:
  cases:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clean (src only)
        id: clean
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: .github|stress|cap|badfmt|fmtok
          step-summary: true
          summary-output-file: .out/clean.md
      - name: stress (odd names, latin1, CRLF, BOM, no final newline)
        id: stress
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: .github|src|cap|badfmt|fmtok
          step-summary: true
          summary-output-file: .out/stress.md
      - name: blank ignore
        id: blank
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: ''
          tidy-checks: '-*'
      - name: repo config files (style file, tidy-checks blank)
        id: repocfg
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: .github|stress|cap|badfmt|fmtok
          style: file
          tidy-checks: ''
      - name: bad .clang-format in one folder
        id: badfmt
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: .github|src|stress|cap
          style: file
          tidy-checks: '-*'
          step-summary: true
          summary-output-file: .out/badfmt.md
      - name: strict input check (bad value)
        id: badinput
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          lines-changed-only: maybe
      - name: Report
        if: always()
        shell: bash
        env:
          CLEAN: ${{ toJSON(steps.clean) }}
          STRESS: ${{ toJSON(steps.stress) }}
          BLANK: ${{ toJSON(steps.blank) }}
          REPOCFG: ${{ toJSON(steps.repocfg) }}
          BADFMT: ${{ toJSON(steps.badfmt) }}
          BADINPUT: ${{ toJSON(steps.badinput) }}
        run: |
          for s in CLEAN STRESS BLANK REPOCFG BADFMT BADINPUT; do
            echo "RESULT ${{ matrix.os }} $s $(jq -c '{outcome, out: .outputs}' <<< "${!s}")"
          done
          for f in .out/*.md; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          git status --short

  versions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ['', '14', '18', '22', '23']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lint
        id: lint
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        with:
          files-changed-only: false
          ignore: .github|stress|cap|badfmt|fmtok
          version: ${{ matrix.version }}
      - name: Report
        if: always()
        shell: bash
        env:
          R: ${{ toJSON(steps.lint) }}
        run: |
          echo "RESULT ${{ matrix.os }} version='${{ matrix.version }}' $(jq -c '{outcome, out: .outputs}' <<< "$R")"
          for t in clang-format clang-tidy; do command -v $t && $t --version | head -n 3 || true; done

  permissions-check:
    strategy:
      fail-fast: false
      matrix:
        token: [read-only, none]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lint
        id: lint
        continue-on-error: true
        uses: cpp-linter/cpp-linter-action@eb04e64a458d95a52bd4ace41f68a3caf6035c8d # v3.0.0-rc0
        env:
          GITHUB_TOKEN: ${{ matrix.token == 'read-only' && secrets.GITHUB_TOKEN || '' }}
        with:
          ignore: .github
          thread-comments: 'true'
          step-summary: true
      - name: Report
        if: always()
        shell: bash
        env:
          R: ${{ toJSON(steps.lint) }}
        run: |
          echo "RESULT token=${{ matrix.token }} $(jq -c '{outcome, out: .outputs}' <<< "$R")"
